[project]
name = "residencial-aurora"
version = "0.1.0"
description = "Assistente do Residencial Aurora com Google ADK"
requires-python = ">=3.12,<3.14"
dependencies = [
    "google-adk[db]==2.9.1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "aiosqlite>=0.21,<1",
    "python-dotenv>=1.1,<2",
    "sqlalchemy[asyncio]>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[project.scripts]
aurora = "aurora.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aurora"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
